short_bio: >-
  <p>
    Welcome to my personal page! 👋 I am a Ph.D. student at the Department of Civil and Environmental Engineering at <a href="https://hkust.edu.hk" target="_blank">HKUST</a> , supervised by <a href="https://walterzwang.github.io/" target="_blank">Prof. Zhe Wang</a>. My research lies at the intersection of <span class="badge badge-pill badge-primary">building energy systems</span>, <span class="badge badge-pill badge-info">EV-grid integration</span>, and <span class="badge badge-pill badge-success">energy storage optimization</span> — with a focus on developing data-driven optimization and control strategies for low-carbon urban energy infrastructure.
  </p>
  <p>
    You might also be interested in the <a href="https://yi-ju.me/eMERGE/" target="_blank">eMERGE Seminar Series</a> 🎨 — a seminar series on Energy, Mobility, and Grid, organized by <a href="https://yi-ju.me/" target="_blank">Yi Ju</a>, with some contributions from me.
  </p>

